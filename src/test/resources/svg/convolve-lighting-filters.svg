<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
<title>Convolution and resampled lighting</title>
<defs>
 <filter id="sharp" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="0 -1 0 -1 5 -1 0 -1 0" preserveAlpha="true"/></filter>
 <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="-2 -1 0 -1 1 1 0 1 2" bias=".35" preserveAlpha="true"/></filter>
 <filter id="edge" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feConvolveMatrix order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true"/></filter>
 <filter id="light" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/><feDiffuseLighting surfaceScale="9" kernelUnitLength="2 3" lighting-color="#ffd9a0"><feDistantLight azimuth="225" elevation="35"/></feDiffuseLighting><feComposite in2="SourceAlpha" operator="in"/></filter>
</defs>
<rect width="640" height="360" fill="#0b1327"/>
<g fill="#1f3553"><rect x="20" y="55" width="140" height="260" rx="16"/><rect x="173" y="55" width="140" height="260" rx="16"/><rect x="326" y="55" width="140" height="260" rx="16"/><rect x="479" y="55" width="140" height="260" rx="16"/></g>
<g fill="#cdeafa" font-family="sans-serif" text-anchor="middle" font-size="16"><text x="320" y="30" font-size="22">Convolution + resampled lighting</text><text x="90" y="85">Sharpen</text><text x="243" y="85">Emboss</text><text x="396" y="85">Edge</text><text x="549" y="85">Grid lighting</text></g>
<g filter="url(#sharp)"><circle cx="90" cy="180" r="48" fill="#43d6d2"/><path d="M55 215L90 130 125 215Z" fill="#f38e81"/></g>
<g filter="url(#emboss)"><circle cx="243" cy="180" r="48" fill="#43d6d2"/><path d="M208 215L243 130 278 215Z" fill="#f38e81"/></g>
<g filter="url(#edge)"><circle cx="396" cy="180" r="48" fill="#43d6d2"/><path d="M361 215L396 130 431 215Z" fill="#f38e81"/></g>
<g filter="url(#light)"><circle cx="549" cy="180" r="48" fill="#43d6d2"/><path d="M514 215L549 130 584 215Z" fill="#f38e81"/></g>
</svg>
