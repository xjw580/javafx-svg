name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: javafx-svg-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.assets.outputs.artifact_name }}
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and refuse an existing release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release/github_release.py preflight --tag "$RELEASE_TAG" --check-remote
      - name: Set up JDK 21 and Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Test release guards
        run: python3 -m unittest discover -s release/tests -v
      - name: Build and test
        run: mvn -B -V -Pheadless clean verify
      - name: Verify packaged consumers
        run: >-
          python3 release/consumers/verify.py --project .
          --jar target/javafx-svg-1.0.0-rc.jar
          --maven-repository "$HOME/.m2/repository"
          --javafx-platform linux --output "$RUNNER_TEMP/svg-consumers" --fx
      - name: Stage exact release assets
        id: assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 release/github_release.py prepare --tag "$RELEASE_TAG" --consumers "$RUNNER_TEMP/svg-consumers/summary.json"
          echo "artifact_name=release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Preserve verified assets for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.assets.outputs.artifact_name }}
          path: |
            target/github-release/
            target/github-release-manifest.json
            target/github-release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: target
      - name: Recheck tag and release state
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release/github_release.py preflight --tag "$RELEASE_TAG" --check-remote
      - name: Create draft and upload candidate assets
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: javafx-svg_${{ github.ref_name }}
          body_path: target/github-release-notes.md
          draft: true
          prerelease: true
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            target/github-release/javafx-svg-1.0.0-rc.jar
            target/github-release/javafx-svg-1.0.0-rc-sources.jar
            target/github-release/javafx-svg-1.0.0-rc.pom
            target/github-release/javafx-svg-1.0.0-rc-source.zip
            target/github-release/verification.json
            target/github-release/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify uploaded digests then publish prerelease
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release/github_release.py publish --tag "$RELEASE_TAG" --release-id "$RELEASE_ID"
