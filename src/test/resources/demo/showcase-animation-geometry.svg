<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180">
  <g fill="#2563eb">
    <circle id="pulse" cx="52" cy="80" r="4">
      <animate attributeName="r" values="4;10;4" dur="1.2s" repeatCount="indefinite" begin="-.8s"/>
      <animate attributeName="cy" values="80;52;80" dur="1.2s" repeatCount="indefinite" begin="-.8s"/>
    </circle>
    <circle cx="80" cy="80" r="4">
      <animate attributeName="r" values="4;10;4" dur="1.2s" repeatCount="indefinite" begin="-.4s"/>
      <animate attributeName="cy" values="80;52;80" dur="1.2s" repeatCount="indefinite" begin="-.4s"/>
    </circle>
    <circle cx="108" cy="80" r="4">
      <animate attributeName="r" values="4;10;4" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;52;80" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="210" cy="76" r="5" fill="#059669"/>
  <circle id="ring" cx="210" cy="76" r="8" fill="none" stroke="#059669" stroke-width="2.5">
    <animate attributeName="r" values="8;34;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;.1;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="340" cy="76" rx="30" ry="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5">
    <animate attributeName="rx" values="30;18;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="10;26;10" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#64748b">
    <text x="80" y="144">BOUNCING DOTS</text><text x="210" y="144">PULSE RADIUS</text><text x="340" y="144">ELLIPSE</text>
  </g>
</svg>
