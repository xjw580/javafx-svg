<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
 <defs>
  <g id="tile"><rect width="24" height="24" rx="5" fill="#1eb6b2"/><circle cx="12" cy="12" r="6" fill="#ffe289"/></g>
  <filter id="tilebase" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="140"><feImage href="#tile" x="0" y="0" width="28" height="28"/><feTile/></filter>
  <filter id="inherit" href="#tilebase"/>
  <filter id="single" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="140"><feImage href="#tile" x="60" y="50" width="40" height="40"/></filter>
 </defs>
 <rect width="600" height="220" fill="#101b30"/>
 <g font-family="sans-serif" font-size="16" fill="#e8f3ff">
  <text x="20" y="30">Local SVG image</text><text x="220" y="30">Repeated tile</text><text x="420" y="30">Inherited filter</text>
 </g>
 <g transform="translate(20 50)"><rect width="160" height="140" fill="#223852"/><rect width="160" height="140" filter="url(#single)"/></g>
 <g transform="translate(220 50)"><rect width="160" height="140" fill="#223852"/><rect width="160" height="140" filter="url(#tilebase)"/></g>
 <g transform="translate(420 50)"><rect width="160" height="140" fill="#223852"/><rect width="160" height="140" filter="url(#inherit)"/></g>
</svg>
