<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
<title>Native SVG lighting filters</title>
<desc>Diffuse and specular lighting with distant, point and spot lights, rendered without WebView.</desc>
<defs>
<filter id="light-0-0" filterUnits="userSpaceOnUse" x="11" y="9" width="178" height="98">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump"/>
<feDiffuseLighting in="bump" surfaceScale="10" diffuseConstant="1.35" lighting-color="#e8f5ff" result="light"><feDistantLight azimuth="225" elevation="48"/></feDiffuseLighting>
<feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1"/>
</filter>
<filter id="light-0-1" filterUnits="userSpaceOnUse" x="11" y="9" width="178" height="98">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump"/>
<feDiffuseLighting in="bump" surfaceScale="10" diffuseConstant="1.35" lighting-color="#e8f5ff" result="light"><fePointLight x="50" y="10" z="75"/></feDiffuseLighting>
<feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1"/>
</filter>
<filter id="light-0-2" filterUnits="userSpaceOnUse" x="11" y="9" width="178" height="98">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump"/>
<feDiffuseLighting in="bump" surfaceScale="10" diffuseConstant="1.35" lighting-color="#e8f5ff" result="light"><feSpotLight x="55" y="-15" z="100" pointsAtX="100" pointsAtY="60" pointsAtZ="0" specularExponent="4" limitingConeAngle="42"/></feDiffuseLighting>
<feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1"/>
</filter>
<filter id="light-1-0" filterUnits="userSpaceOnUse" x="11" y="9" width="178" height="98">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump"/>
<feSpecularLighting in="bump" surfaceScale="10" specularConstant="1.25" specularExponent="16" lighting-color="#e8f5ff" result="light"><feDistantLight azimuth="225" elevation="48"/></feSpecularLighting>
<feComposite in="light" in2="SourceAlpha" operator="in" result="highlight"/>
<feComposite in="SourceGraphic" in2="highlight" operator="arithmetic" k2="1" k3="1"/>
</filter>
<filter id="light-1-1" filterUnits="userSpaceOnUse" x="11" y="9" width="178" height="98">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump"/>
<feSpecularLighting in="bump" surfaceScale="10" specularConstant="1.25" specularExponent="16" lighting-color="#e8f5ff" result="light"><fePointLight x="50" y="10" z="75"/></feSpecularLighting>
<feComposite in="light" in2="SourceAlpha" operator="in" result="highlight"/>
<feComposite in="SourceGraphic" in2="highlight" operator="arithmetic" k2="1" k3="1"/>
</filter>
<filter id="light-1-2" filterUnits="userSpaceOnUse" x="11" y="9" width="178" height="98">
<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="bump"/>
<feSpecularLighting in="bump" surfaceScale="10" specularConstant="1.25" specularExponent="16" lighting-color="#e8f5ff" result="light"><feSpotLight x="55" y="-15" z="100" pointsAtX="100" pointsAtY="60" pointsAtZ="0" specularExponent="4" limitingConeAngle="42"/></feSpecularLighting>
<feComposite in="light" in2="SourceAlpha" operator="in" result="highlight"/>
<feComposite in="SourceGraphic" in2="highlight" operator="arithmetic" k2="1" k3="1"/>
</filter>
</defs>
<rect width="720" height="440" fill="#091427"/>
<text x="28" y="36" font-family="sans-serif" font-size="23" font-weight="bold" fill="#f1f6ff">SVG LIGHTING</text>
<text x="692" y="34" text-anchor="end" font-family="sans-serif" font-size="12" fill="#8297b4">Native pixels · 3 light sources × 2 models</text>
