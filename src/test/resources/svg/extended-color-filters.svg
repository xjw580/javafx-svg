<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280"><title>Extended blends and component transfer</title><rect width="600" height="280" fill="#101b30"/><defs><filter id="b0" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feFlood flood-color="#e0a040" result="back"/><feBlend in="SourceGraphic" in2="back" mode="overlay"/></filter><filter id="b1" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feFlood flood-color="#e0a040" result="back"/><feBlend in="SourceGraphic" in2="back" mode="hard-light"/></filter><filter id="b2" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feFlood flood-color="#e0a040" result="back"/><feBlend in="SourceGraphic" in2="back" mode="soft-light"/></filter><filter id="b3" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feFlood flood-color="#e0a040" result="back"/><feBlend in="SourceGraphic" in2="back" mode="difference"/></filter><filter id="b4" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feFlood flood-color="#e0a040" result="back"/><feBlend in="SourceGraphic" in2="back" mode="color"/></filter><filter id="b5" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feFlood flood-color="#e0a040" result="back"/><feBlend in="SourceGraphic" in2="back" mode="luminosity"/></filter><filter id="t" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="table" tableValues="0 .8 1"/><feFuncG type="gamma" exponent="2"/><feFuncB type="linear" slope="-.7" intercept="1"/></feComponentTransfer></filter></defs><rect x="14" y="22" width="128" height="80" rx="10" fill="#4488cc" filter="url(#b0)"/><text x="78" y="127" text-anchor="middle" fill="white" font-size="14">overlay</text><rect x="162" y="22" width="128" height="80" rx="10" fill="#4488cc" filter="url(#b1)"/><text x="226" y="127" text-anchor="middle" fill="white" font-size="14">hard-light</text><rect x="310" y="22" width="128" height="80" rx="10" fill="#4488cc" filter="url(#b2)"/><text x="374" y="127" text-anchor="middle" fill="white" font-size="14">soft-light</text><rect x="458" y="22" width="128" height="80" rx="10" fill="#4488cc" filter="url(#b3)"/><text x="522" y="127" text-anchor="middle" fill="white" font-size="14">difference</text><rect x="14" y="147" width="128" height="80" rx="10" fill="#4488cc" filter="url(#b4)"/><text x="78" y="252" text-anchor="middle" fill="white" font-size="14">color</text><rect x="162" y="147" width="128" height="80" rx="10" fill="#4488cc" filter="url(#b5)"/><text x="226" y="252" text-anchor="middle" fill="white" font-size="14">luminosity</text><rect x="310" y="147" width="128" height="80" rx="10" fill="#4488cc"/><text x="374" y="252" text-anchor="middle" fill="white" font-size="14">original</text><rect x="458" y="147" width="128" height="80" rx="10" fill="#4488cc" filter="url(#t)"/><text x="522" y="252" text-anchor="middle" fill="white" font-size="14">transfer</text></svg>