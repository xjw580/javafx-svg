<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180">
  <style>
    @keyframes flash {
      from { opacity: .2; }
      to { opacity: 1; }
    }
    .dot { fill: #2563eb; animation: flash 1.2s ease-in-out infinite alternate both; }
    .phase-a { animation-delay: -.8s; }
    .phase-b { animation-delay: -.4s; }
    .phase-c { animation-direction: alternate-reverse; }
    @keyframes turn {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .step {
      fill: #059669; animation: turn 2s steps(4,end) infinite;
      transform-origin: center; transform-box: fill-box;
    }
    @keyframes ink {
      from { fill: #7c3aed; }
      to { fill: #db2777; }
    }
    @keyframes breathe {
      from { opacity: .4; transform: scale(.75); }
      to { opacity: 1; transform: scale(1.15); }
    }
    .mix {
      animation: ink 3s linear infinite alternate, breathe 1.6s ease-in-out infinite alternate;
      transform-origin: center; transform-box: fill-box;
    }
  </style>
  <circle class="dot phase-a" cx="52" cy="76" r="8"/>
  <circle class="dot phase-b" cx="80" cy="76" r="8"/>
  <circle class="dot phase-c" cx="108" cy="76" r="8"/>
  <path id="css-step" class="step" d="M190 48H230V60H202V96H190Z"/>
  <circle id="css-mix" class="mix" cx="340" cy="76" r="24" fill="#7c3aed"/>
  <g font-family="sans-serif" font-size="12" text-anchor="middle" fill="#64748b">
    <text x="80" y="144">DELAY + REVERSE</text><text x="210" y="144">STEP ROTATION</text><text x="340" y="144">TWO ANIMATIONS</text>
  </g>
</svg>
