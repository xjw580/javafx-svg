<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
<title>Animated filter parameters</title><desc>Authored regression sample: scalar, vector and colour SMIL, paused at deterministic time by tests.</desc>
<defs>
<filter id="blur" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur><animate attributeName="stdDeviation" values="0 0;5 1;0 0" dur="4s" repeatCount="indefinite"/></feGaussianBlur></filter>
<filter id="offset" x="-20%" y="-20%" width="180%" height="150%"><feOffset><animate attributeName="dx" values="0;25;0" dur="4s" repeatCount="indefinite"/><animate attributeName="dy" values="0;12;0" dur="4s" repeatCount="indefinite"/></feOffset></filter>
<filter id="morph" x="-30%" y="-50%" width="160%" height="200%"><feMorphology operator="dilate"><animate attributeName="radius" values="0;7 2;0" dur="4s" repeatCount="indefinite"/></feMorphology></filter>
<filter id="flood" x="0" y="0" width="100%" height="100%"><feFlood><animate attributeName="flood-color" values="#dc4870;#4c8ded;#dc4870" dur="4s" repeatCount="indefinite"/><animate attributeName="flood-opacity" values=".4;1;.4" dur="4s" repeatCount="indefinite"/></feFlood><feComposite in2="SourceGraphic" operator="in"/></filter>
</defs>
<rect width="600" height="200" fill="#101b30"/>
<g fill="#53dbcb"><rect x="28" y="48" width="92" height="75" rx="12" filter="url(#blur)"/><rect x="170" y="48" width="92" height="75" rx="12" filter="url(#offset)"/><rect x="312" y="48" width="92" height="75" rx="12" filter="url(#morph)"/><rect x="454" y="48" width="92" height="75" rx="12" filter="url(#flood)"/></g>
<g fill="white" font-size="17" text-anchor="middle"><text x="74" y="168">blur vector</text><text x="216" y="168">offset</text><text x="358" y="168">morphology</text><text x="500" y="168">colour/alpha</text></g>
</svg>
